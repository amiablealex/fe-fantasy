<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Styleguide{% endblock %} — Formula E Fantasy</title>
<link rel="preload" href="{{ url_for('static', filename='fonts/Archivo.woff2') }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/primitives.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/styleguide.css') }}">
</head>
<body>
<div class="measure">

<nav class="sg-nav">
  <a class="sg-btn" href="{{ url_for('styleguide.index') }}" {% if page == 'tokens' %}aria-current="true"{% endif %}>Tokens</a>
  <a class="sg-btn" href="{{ url_for('styleguide.lineup') }}" {% if page == 'lineup' %}aria-current="true"{% endif %}>Lineup</a>
  <a class="sg-btn" href="{{ url_for('styleguide.meeting') }}" {% if page == 'meeting' %}aria-current="true"{% endif %}>Results</a>
  <span class="sg-bar__vp label num" id="vp"></span>
</nav>

{% block content %}{% endblock %}

</div>
<script>
(function () {
  var vp = document.getElementById('vp');
  if (vp) {
    var report = function () { vp.textContent = window.innerWidth + 'px'; };
    report();
    window.addEventListener('resize', report);
  }
})();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
