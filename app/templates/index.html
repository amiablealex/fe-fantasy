{% extends "base.html" %}
{% block content %}
<h1>Formula E Fantasy</h1>
{% if current_user.is_authenticated %}
  <p>Signed in as {{ current_user.username }}.</p>
  <p>Nothing here yet. The lineup arrives in Phase 4, scoring in Phase 5.</p>
{% else %}
  <p><a href="{{ url_for('auth.login') }}">Sign in</a> or
     <a href="{{ url_for('auth.register') }}">create an account</a>.</p>
{% endif %}
{% endblock %}
