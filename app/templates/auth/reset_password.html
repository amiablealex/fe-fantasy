{% extends "base.html" %}
{% from "_macros.html" import field %}
{% block content %}
<h1>Reset password</h1>
<form method="post" novalidate>
  {{ form.hidden_tag() }}
  {{ field(form.password, autocomplete="new-password") }}
  {{ field(form.confirm_password, autocomplete="new-password") }}
  {{ form.submit() }}
</form>
{% endblock %}
