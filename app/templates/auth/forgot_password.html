{% extends "base.html" %}
{% from "_macros.html" import field %}
{% block main_class %}gate{% endblock %}
{% block content %}
<h1 class="page-title">Forgot password</h1>
<form method="post" novalidate>
  {{ form.hidden_tag() }}
  {{ field(form.email, type="email", autocomplete="email") }}
  {{ form.submit() }}
</form>
{% endblock %}
